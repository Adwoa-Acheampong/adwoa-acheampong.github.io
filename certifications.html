  <title>Adwoa B. Acheampong | Certifications</title>
  <style>
    .cert-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .cert-card {
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(2, 12, 8, .82);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
    }

    .cert-card figure {
      margin: 0;
    }

    .cert-media {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 11;
      object-fit: contain;
      background: #07110d;
    }

    .cert-card figcaption {
      display: grid;
      gap: .45rem;
      padding: 1rem;
    }

    .cert-card h2 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.35rem, 3vw, 2rem);
      line-height: 1.05;
    }

    .cert-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .cert-card a {
      width: fit-content;
      color: var(--emerald);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      .cert-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
